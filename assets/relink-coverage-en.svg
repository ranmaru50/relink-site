<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Where existing technologies stop and RELink connects</title>
  <desc id="desc">Existing technologies are strong in individual parts of the path from the physical world to information services. RELink is shown as a thin interoperability layer connecting that path.</desc>
  <defs>
    <style>
      .bg{fill:#071b2b}.grid{stroke:#426071;stroke-width:1}.axis{stroke:#a7f3d0;stroke-width:2}.label{fill:#f2efe6;font:500 22px Arial,sans-serif}.small{fill:#b8c6ce;font:500 16px Arial,sans-serif}.mono{fill:#a7f3d0;font:600 14px 'IBM Plex Mono',monospace;letter-spacing:1.5px}.box{stroke:#f2efe6;stroke-width:1.5;rx:8}.tech{fill:#17364b}.relink{fill:#a7f3d0}.relinktext{fill:#071b2b;font:600 19px Arial,sans-serif}.arrow{stroke:#ff765f;stroke-width:3;fill:none;marker-end:url(#head)}.thin{fill:#ff765f;font:600 14px 'IBM Plex Mono',monospace;letter-spacing:.5px}.tag{fill:#ffd166}.tagtext{fill:#071b2b;font:600 15px Arial,sans-serif}
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#ff765f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="690" rx="18"/>
  <g opacity=".42"><path class="grid" d="M70 105H1130M70 190H1130M70 275H1130M70 360H1130M70 445H1130M70 530H1130M70 615H1130M175 70V620M350 70V620M525 70V620M700 70V620M875 70V620M1050 70V620"/></g>
  <text class="mono" x="70" y="54">WHERE EXISTING TECHNOLOGIES STOP</text>
  <text class="label" x="70" y="92">Physical world</text><text class="label" x="932" y="92">Information services</text>
  <path class="axis" d="M90 640H1110" marker-end="url(#head)"/>
  <text class="small" x="70" y="670">The thing in front of you</text><text class="small" x="884" y="670">Existing APIs, protocols, and services</text>
  <g>
    <rect class="box tech" x="92" y="150" width="180" height="78"/><text class="label" x="121" y="183">QR / NFC</text><text class="small" x="121" y="211">physical entry</text>
    <rect class="box tech" x="255" y="268" width="170" height="78"/><text class="label" x="291" y="301">BLE</text><text class="small" x="291" y="329">proximity link</text>
    <rect class="box tech" x="775" y="150" width="205" height="78"/><text class="label" x="805" y="183">Web API / OpenAPI</text><text class="small" x="805" y="211">service access</text>
    <rect class="box tech" x="865" y="268" width="176" height="78"/><text class="label" x="893" y="301">OAuth / WebAuthn</text><text class="small" x="893" y="329">authentication</text>
    <rect class="box tech" x="728" y="386" width="260" height="78"/><text class="label" x="758" y="419">WoT / OPC UA / GS1</text><text class="small" x="758" y="447">domain strengths</text>
  </g>
  <g><path class="arrow" d="M305 189C430 116 566 116 686 189"/><path class="arrow" d="M435 307C550 241 650 241 760 307"/><text class="thin" x="412" y="164">Strong individually; a cross-cutting path is rebuilt each time</text></g>
  <g><rect class="relink" x="300" y="500" width="600" height="82" rx="10"/><text class="relinktext" x="332" y="536">RELink: Physical Anchor → Resolver → Entity → Capability → Interface</text><text class="relinktext" x="332" y="563">A thin interoperability layer to reach existing technologies</text><rect class="tag" x="918" y="511" width="195" height="44" rx="5"/><text class="tagtext" x="946" y="540">Connect, not replace</text></g>
</svg>
